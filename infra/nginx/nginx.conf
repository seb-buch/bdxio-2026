events {}

http {
  # Vite's HMR uses WebSocket over the same HTTPS origin as the slides.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    server_name bdxio2026.demo;

    ssl_certificate     /etc/nginx/certs/bdxio2026.demo.pem;
    ssl_certificate_key /etc/nginx/certs/bdxio2026.demo-key.pem;

    location / {
      proxy_pass http://host.containers.internal:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
}
